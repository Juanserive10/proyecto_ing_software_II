# 6 bases de datos MySQL independientes (RNF02) con PersistentVolumeClaim propio
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-mysql-usuarios
  namespace: andina-inventory
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-usuarios
  namespace: andina-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-usuarios
  template:
    metadata:
      labels:
        app: mysql-usuarios
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: andina-secrets, key: MYSQL_ROOT_PASSWORD } }
            - name: MYSQL_DATABASE
              value: db_usuarios
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pvc-mysql-usuarios }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-usuarios
  namespace: andina-inventory
spec:
  selector: { app: mysql-usuarios }
  ports: [{ port: 3306, targetPort: 3306 }]
---
