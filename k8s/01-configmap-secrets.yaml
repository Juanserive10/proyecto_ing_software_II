apiVersion: v1
kind: ConfigMap
metadata:
  name: andina-config
  namespace: andina-inventory
data:
  INVENTARIO_URL: "http://inventario-service:5003"
  CATALOGO_URL: "http://catalogo-service:5002"
  VENTAS_URL: "http://ventas-service:5005"
  USUARIOS_URL: "http://usuarios-service:5001"
  ABASTECIMIENTO_URL: "http://abastecimiento-service:5004"
  REPORTES_URL: "http://reportes-service:5006"
  RABBITMQ_EXCHANGE: "andina.events"
---
apiVersion: v1
kind: Secret
metadata:
  name: andina-secrets
  namespace: andina-inventory
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "andina_root_password"
  JWT_SECRET: "andina-jwt-super-secret-2026"
  RABBITMQ_USER: "andina"
  RABBITMQ_PASS: "andina_rabbit_2026"
  RABBITMQ_URL: "amqp://andina:andina_rabbit_2026@rabbitmq:5672/"
  DB_USUARIOS_URL: "mysql+pymysql://root:andina_root_password@mysql-usuarios:3306/db_usuarios"
  DB_CATALOGO_URL: "mysql+pymysql://root:andina_root_password@mysql-catalogo:3306/db_catalogo"
  DB_INVENTARIO_URL: "mysql+pymysql://root:andina_root_password@mysql-inventario:3306/db_inventario"
  DB_ABASTECIMIENTO_URL: "mysql+pymysql://root:andina_root_password@mysql-abastecimiento:3306/db_abastecimiento"
  DB_VENTAS_URL: "mysql+pymysql://root:andina_root_password@mysql-ventas:3306/db_ventas"
  DB_REPORTES_URL: "mysql+pymysql://root:andina_root_password@mysql-reportes:3306/db_reportes"
