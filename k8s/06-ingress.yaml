# Ingress preparado para exponer el Frontend y el API Gateway propio de Cristian (RNF09)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: andina-ingress
  namespace: andina-inventory
spec:
  rules:
    - host: andina.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
