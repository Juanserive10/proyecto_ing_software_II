# Despliegues y Services ClusterIP para los 6 microservicios + Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-service
  namespace: andina-inventory
spec:
  replicas: 1
  selector: { matchLabels: { app: usuarios-service } }
  template:
    metadata: { labels: { app: usuarios-service } }
    spec:
      containers:
        - name: usuarios-service
          image: andina/usuarios-service:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5001 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: andina-secrets, key: DB_USUARIOS_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: andina-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-service
  namespace: andina-inventory
spec:
  selector: { app: usuarios-service }
  ports: [{ port: 5001, targetPort: 5001 }]
---
